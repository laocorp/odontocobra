    function exportCsv(){var rows=[["recibo","paciente","fecha","importe_recibido","moneda","equivalente_usd","tasa_muestra","plan"]].concat(payments.map(function(p){return [p.code,p.patient,p.date,p.received,p.currency,p.usd,p.rate,p.plan]}));var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="odonto-cuenta-cobros-demo.csv";a.click();URL.revokeObjectURL(a.href);toast("CSV de demostración descargado.")}
    document.addEventListener("click",function(e){
      var view=e.target.closest("[data-view]");if(view){setView(view.dataset.view,view.dataset.id);return}
      if(e.target.closest("[data-mobile-menu]")){document.querySelector("#mobile-menu").classList.toggle("open");return}
      var open=e.target.closest("[data-open]");if(open){openModal(open.dataset.open,open.dataset.patient||"");return}
      if(e.target.closest("[data-close]")){closeModal();return}
      if(e.target===modal){closeModal();return}
      var tab=e.target.closest("[data-tab]");if(tab){state.detailTab=tab.dataset.tab;render();return}
      var filter=e.target.closest("[data-filter]");if(filter){state.filter=filter.dataset.filter;filter.parentElement.querySelectorAll("[data-filter]").forEach(function(b){b.classList.toggle("active",b===filter)});document.querySelectorAll("#view-root tr[data-status]").forEach(function(r){r.hidden=state.filter!=="all"&&r.dataset.status!==state.filter});return}
      var actionEl=e.target.closest("[data-action]");if(actionEl){var a=actionEl.dataset.action;if(a.indexOf("payment:")===0){openModal("payment",a.split(":")[1]);return}if(a.indexOf("patient:")===0){setView("patient-detail",a.split(":")[1]);return}if(a.indexOf("receipt:")===0){showReceipt(a.split(":")[1]);return}if(a.indexOf("edit-service:")===0){toast("Edición de servicio · prototipo");return}if(a==="csv"){exportCsv();return}if(a==="download-statement"){toast("Estado de cuenta PDF · vista de muestra");return}if(a==="save-settings"){toast("Cambios de demostración guardados");return}}
      var row=e.target.closest("tr[data-open-view]");if(row){setView(row.dataset.openView,row.dataset.id);return}
      var toastEl=e.target.closest("[data-toast]");if(toastEl)toast(toastEl.dataset.toast);
    });
    document.addEventListener("input",function(e){if(e.target.matches("[data-search-input]"))filteredRows(e.target.value)});
    document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeModal();document.querySelector("#mobile-menu").classList.remove("open")}});
    form.addEventListener("submit",function(e){e.preventDefault();var fd=new FormData(form),mode=modal.dataset.mode;
      if(mode==="patient"){var name=String(fd.get("first")+" "+fd.get("last"));patients.unshift({id:"P-0"+(249+patients.length),name:name,initials:String(fd.get("first")[0]+fd.get("last")[0]).toUpperCase(),idno:String(fd.get("idno")).slice(0,2)+".***.***",phone:fd.get("phone"),email:fd.get("email")||"—",address:fd.get("address")||"—",status:"Activo",plans:0,balance:0,due:"—",tone:"mint"});state.view="patients";render();toast("Paciente añadido al prototipo.")}
      else if(mode==="plan"){var total=Number(fd.get("total"));plans.unshift({code:"OD-0"+(149+plans.length),patient:fd.get("patient"),service:fd.get("service"),total:total,paid:0,parts:Number(fd.get("parts")),next:fd.get("date"),status:"Al día"});state.view="plans";render();toast("Plan de demostración creado.")}
      else if(mode==="payment"){var curr=fd.get("currency"),amount=Number(fd.get("amount")),name=fd.get("patient");payments.unshift({code:"RC-0"+(88+payments.length),patient:name,plan:String(fd.get("plan")||"").split(" · ")[0]||"—",date:"10 oct 2026 · ahora",received:amount,currency:curr==="VES"?"Bs.":"USD",usd:curr==="VES"?amount/rate:amount,method:fd.get("method"),rate:rate});state.view="payments";render();toast("Pago de muestra registrado.")}
      else if(mode==="service"){services.unshift({name:fd.get("name"),description:fd.get("description")||"Servicio cobrable",price:Number(fd.get("price")),category:fd.get("category"),active:true});state.view="services";render();toast("Servicio añadido al prototipo.")}
      else if(mode==="invite"){team.push({name:fd.get("name"),initials:String(fd.get("name").split(" ").map(function(x){return x[0]}).slice(0,2).join("")).toUpperCase(),email:fd.get("email"),role:"Asistente",state:"Invitación enviada"});state.view="team";render();toast("Invitación de muestra creada.")}
      else if(mode==="receipt"){closeModal();toast("El PDF estará disponible en la app final.");return}
      closeModal();form.reset();
    });
    render();
  })();
  </script>
</body>
</html>
